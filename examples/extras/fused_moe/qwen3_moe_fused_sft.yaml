### Qwen3-MoE SFT with CUDA Fused MoE Kernel
###
### This config demonstrates training Qwen3-MoE models with the fused MoE kernel
### for ~5x speedup over the default HuggingFace implementation.
###
### Prerequisites:
###   pip install git+https://github.com/woct0rdho/transformers-qwen3-moe-fused.git
###
### Usage:
###   llamafactory-cli train examples/extras/fused_moe/qwen3_moe_fused_sft.yaml
###
### For distributed training:
###   accelerate launch --config_file examples/accelerate/fsdp_config.yaml \
###     src/train.py examples/extras/fused_moe/qwen3_moe_fused_sft.yaml

### Model
model_name_or_path: Qwen/Qwen3-30B-A3B
trust_remote_code: true

### Attention & Kernels
flash_attn: fa2
enable_liger_kernel: true
use_v1_kernels: true  # Enable fused MoE kernel (requires qwen3-moe-fused)

### Method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json  # Use ZeRO-2 for MoE (ZeRO-3 incompatible)

### Dataset
### Replace with your dataset
dataset: identity
template: qwen3
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_num_workers: 4

### Output
output_dir: outputs/qwen3_moe_fused_sft
logging_steps: 5
save_strategy: steps
save_steps: 200
save_total_limit: 2
logging_strategy: steps
plot_loss: true

### Training hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 4.0e-5
num_train_epochs: 3.0
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### Optimizer
optim: adamw_torch_fused
adam_beta2: 0.98
