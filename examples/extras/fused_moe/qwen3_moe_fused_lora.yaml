### Qwen3-MoE LoRA with CUDA Fused MoE Kernel
###
### This config demonstrates LoRA fine-tuning of Qwen3-MoE models with the fused
### MoE kernel. LoRA + fused kernel + 4-bit quantization allows training on a
### single 24GB GPU.
###
### Prerequisites:
###   pip install git+https://github.com/woct0rdho/transformers-qwen3-moe-fused.git bitsandbytes
###
### Usage:
###   llamafactory-cli train examples/extras/fused_moe/qwen3_moe_fused_lora.yaml
###
### Expected performance:
###   - ~5x speedup over unfused MoE implementation
###   - 100% GPU utilization
###   - Single 24GB GPU can fine-tune Qwen3-30B-A3B with QLoRA

### Model
model_name_or_path: Qwen/Qwen3-30B-A3B
trust_remote_code: true

### Attention & Kernels
flash_attn: fa2
enable_liger_kernel: true
use_v1_kernels: true  # Enable fused MoE kernel (requires qwen3-moe-fused)

### Method - LoRA
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### Quantization (optional - enables QLoRA for memory efficiency)
# Uncomment the following for 4-bit QLoRA:
# quantization_bit: 4
# quantization_method: bitsandbytes

### Dataset
### Replace with your dataset
dataset: identity
template: qwen3
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_num_workers: 2

### Output
output_dir: outputs/qwen3_moe_fused_lora
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
logging_strategy: steps
plot_loss: true

### Training hyperparameters
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### Optimizer
optim: adamw_torch_fused
adam_beta2: 0.98
